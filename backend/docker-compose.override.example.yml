# Local Development Configuration
# Copy this file to docker-compose.override.yml and update with your local values
# docker-compose.override.yml is gitignored and contains your local secrets

services:
  db:
    environment:
      MYSQL_ROOT_PASSWORD: root_db_password_local
      # User credentials for init script
      WP_HOME_DB_USER: wp_home_db_user
      WP_HOME_DB_PASSWORD: local_db_password
      WP_CUSTOMERS_DB_USER: wp_customers_db_user
      WP_CUSTOMERS_DB_PASSWORD: local_db_password
    ports:
      # Expose MySQL port for local development (optional)
      - "3306:3306"

  wp-home-site-php:
    # For local dev, use development target with volume mounts
    build:
      target: development
    volumes:
      # Mount source code for live reloading
      - ./services/wp-home-site:/var/www/html
    environment:
      DB_NAME: wp_home_site_db
      DB_USER: wp_home_db_user
      DB_PASSWORD: local_db_password
      DB_HOST: db:3306
      WP_ENV: development
      WP_HOME: http://localhost:8080
      WP_SITEURL: http://localhost:8080/wp
      # NOTE: Use only alphanumeric [0-9a-zA-Z] to avoid $ interpolation issues
      # Generate your own keys at https://roots.io/salts.html (then remove special chars)
      AUTH_KEY: "local-dev-auth-key-change-me"
      SECURE_AUTH_KEY: "local-dev-secure-auth-key-change-me"
      LOGGED_IN_KEY: "local-dev-logged-in-key-change-me"
      NONCE_KEY: "local-dev-nonce-key-change-me"
      AUTH_SALT: "local-dev-auth-salt-change-me"
      SECURE_AUTH_SALT: "local-dev-secure-auth-salt-change-me"
      LOGGED_IN_SALT: "local-dev-logged-in-salt-change-me"
      NONCE_SALT: "local-dev-nonce-salt-change-me"
      # WordPress auto-installation
      WP_ADMIN_USER: "admin"
      WP_ADMIN_PASSWORD: "local_wp_password"
      WP_ADMIN_EMAIL: "dev@example.com"
      WP_SITE_TITLE: "Home Site (Local Dev)"
      # Development debugging
      WP_DEBUG: "true"
      WP_DEBUG_DISPLAY: "true"
      WP_DEBUG_LOG: "false"

  wp-home-site-nginx:
    volumes:
      # Mount source code for nginx to serve static files
      - ./services/wp-home-site:/var/www/html:ro
    ports:
      # Expose port directly for local access
      - "8080:80"

  wp-customer-sites-php:
    # For local dev, use development target with volume mounts
    build:
      target: development
    volumes:
      # Mount source code for live reloading
      - ./services/wp-customer-sites:/var/www/html
    environment:
      DB_NAME: wp_customer_sites_db
      DB_USER: wp_customers_db_user
      DB_PASSWORD: local_db_password
      DB_HOST: db:3306
      WP_ENV: development
      WP_HOME: http://localhost:8090
      WP_SITEURL: http://localhost:8090/wp
      # NOTE: Use only alphanumeric [0-9a-zA-Z] to avoid $ interpolation issues
      # Generate your own keys at https://roots.io/salts.html (then remove special chars)
      AUTH_KEY: "local-dev-auth-key-change-me"
      SECURE_AUTH_KEY: "local-dev-secure-auth-key-change-me"
      LOGGED_IN_KEY: "local-dev-logged-in-key-change-me"
      NONCE_KEY: "local-dev-nonce-key-change-me"
      AUTH_SALT: "local-dev-auth-salt-change-me"
      SECURE_AUTH_SALT: "local-dev-secure-auth-salt-change-me"
      LOGGED_IN_SALT: "local-dev-logged-in-salt-change-me"
      NONCE_SALT: "local-dev-nonce-salt-change-me"
      # WordPress auto-installation
      WP_ADMIN_USER: "admin"
      WP_ADMIN_PASSWORD: "local_wp_password"
      WP_ADMIN_EMAIL: "dev@example.com"
      WP_SITE_TITLE: "Customer Sites (Local Dev)"
      # Development debugging
      WP_DEBUG: "true"
      WP_DEBUG_DISPLAY: "true"
      WP_DEBUG_LOG: "false"

  wp-customer-sites-nginx:
    volumes:
      # Mount source code for nginx to serve static files
      - ./services/wp-customer-sites:/var/www/html:ro
    ports:
      # Expose port directly for local access
      - "8090:80"

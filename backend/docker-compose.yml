name: sytesbook-business-backend

services:
  backend-db:
    image: mysql:8.4
    container_name: backend-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Pass credentials for user creation script
      WP_HOME_DB_USER: ${WP_HOME_DB_USER}
      WP_HOME_DB_PASSWORD: ${WP_HOME_DB_PASSWORD}
      WP_CUSTOMERS_DB_USER: ${WP_CUSTOMERS_DB_USER}
      WP_CUSTOMERS_DB_PASSWORD: ${WP_CUSTOMERS_DB_PASSWORD}
      CONTENT_DB_USER: ${CONTENT_DB_USER}
      CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD}
    volumes:
      - backend_db_data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend-network
    healthcheck:
      # Use socket-based health check (no password needed for localhost)
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
      interval: 10s

  wp-home-site-php:
    build:
      context: .
      dockerfile: services/wp-home-site/Dockerfile
      target: production
    container_name: wp-home-site-php
    restart: unless-stopped
    environment:
      DB_NAME: ${WP_HOME_DB_NAME}
      DB_USER: ${WP_HOME_DB_USER}
      DB_PASSWORD: ${WP_HOME_DB_PASSWORD}
      DB_HOST: backend-db:3306
      WP_ENV: ${WP_HOME_ENV}
      WP_HOME: https://home.${DOMAIN}
      WP_SITEURL: https://home.${DOMAIN}/wp
      # WordPress security keys
      AUTH_KEY: ${WP_HOME_AUTH_KEY}
      SECURE_AUTH_KEY: ${WP_HOME_SECURE_AUTH_KEY}
      LOGGED_IN_KEY: ${WP_HOME_LOGGED_IN_KEY}
      NONCE_KEY: ${WP_HOME_NONCE_KEY}
      AUTH_SALT: ${WP_HOME_AUTH_SALT}
      SECURE_AUTH_SALT: ${WP_HOME_SECURE_AUTH_SALT}
      LOGGED_IN_SALT: ${WP_HOME_LOGGED_IN_SALT}
      NONCE_SALT: ${WP_HOME_NONCE_SALT}
      # WordPress auto-installation
      WP_ADMIN_USER: ${WP_HOME_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_HOME_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_HOME_ADMIN_EMAIL}
      WP_SITE_TITLE: ${WP_HOME_SITE_TITLE:-Business Sytesbook Home}
    volumes:
      - wp_home_uploads:/var/www/html/web/app/uploads
    depends_on:
      backend-db:
        condition: service_healthy
    networks:
      - backend-network

  wp-home-site-nginx:
    image: nginx:alpine
    container_name: wp-home-site-nginx
    restart: unless-stopped
    volumes:
      - ./services/wp-home-site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - wp_home_uploads:/var/www/html/web/app/uploads:ro
    ports:
      - "8080:80"
    depends_on:
      - wp-home-site-php
    networks:
      - backend-network

  wp-customer-sites-php:
    build:
      context: .
      dockerfile: services/wp-customer-sites/Dockerfile
      target: production
    container_name: wp-customer-sites-php
    restart: unless-stopped
    environment:
      DB_NAME: ${WP_CUSTOMERS_DB_NAME}
      DB_USER: ${WP_CUSTOMERS_DB_USER}
      DB_PASSWORD: ${WP_CUSTOMERS_DB_PASSWORD}
      DB_HOST: backend-db:3306
      WP_ENV: ${WP_CUSTOMERS_ENV}
      WP_HOME: https://customers.${DOMAIN}
      WP_SITEURL: https://customers.${DOMAIN}/wp
      # WordPress security keys
      AUTH_KEY: ${WP_CUSTOMERS_AUTH_KEY}
      SECURE_AUTH_KEY: ${WP_CUSTOMERS_SECURE_AUTH_KEY}
      LOGGED_IN_KEY: ${WP_CUSTOMERS_LOGGED_IN_KEY}
      NONCE_KEY: ${WP_CUSTOMERS_NONCE_KEY}
      AUTH_SALT: ${WP_CUSTOMERS_AUTH_SALT}
      SECURE_AUTH_SALT: ${WP_CUSTOMERS_SECURE_AUTH_SALT}
      LOGGED_IN_SALT: ${WP_CUSTOMERS_LOGGED_IN_SALT}
      NONCE_SALT: ${WP_CUSTOMERS_NONCE_SALT}
      # WordPress auto-installation
      WP_ADMIN_USER: ${WP_CUSTOMERS_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_CUSTOMERS_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_CUSTOMERS_ADMIN_EMAIL}
      WP_SITE_TITLE: ${WP_CUSTOMERS_SITE_TITLE:-Business Sytesbook Customers}
    volumes:
      - wp_customers_uploads:/var/www/html/web/app/uploads
    depends_on:
      backend-db:
        condition: service_healthy
    networks:
      - backend-network

  wp-customer-sites-nginx:
    image: nginx:alpine
    container_name: wp-customer-sites-nginx
    restart: unless-stopped
    volumes:
      - ./services/wp-customer-sites/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - wp_customers_uploads:/var/www/html/web/app/uploads:ro
    ports:
      - "8090:80"
    depends_on:
      - wp-customer-sites-php
    networks:
      - backend-network

  content-service-php:
    build:
      context: .
      dockerfile: services/content-service/Dockerfile
      target: production
    container_name: content-service-php
    restart: unless-stopped
    environment:
      DB_CONNECTION: mysql
      DB_HOST: backend-db
      DB_PORT: "3306"
      DB_DATABASE: ${CONTENT_DB_NAME}
      DB_USERNAME: ${CONTENT_DB_USER}
      DB_PASSWORD: ${CONTENT_DB_PASSWORD}
      APP_NAME: content-service
      APP_ENV: ${CONTENT_SERVICE_ENV}
      APP_KEY: ${CONTENT_SERVICE_KEY}
      APP_DEBUG: "false"
      APP_URL: https://content.${DOMAIN}
    depends_on:
      backend-db:
        condition: service_healthy
    networks:
      - backend-network

  content-service-nginx:
    image: nginx:alpine
    container_name: content-service-nginx
    restart: unless-stopped
    volumes:
      - ./services/content-service/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8100:80"
    depends_on:
      - content-service-php
    networks:
      - backend-network

  router-service:
    build:
      context: .
      dockerfile: services/router-service/Dockerfile
      target: production
    container_name: router-service
    restart: unless-stopped
    environment:
      CONTENT_SERVICE_URL: http://content-service-nginx
      WP_CUSTOMER_SITES_URL: http://wp-customer-sites-nginx
      PORT: "80"
      DOMAIN_TTL: "5m"
    ports:
      - "8110:80"
    depends_on:
      - content-service-nginx
      - wp-customer-sites-nginx
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  backend_db_data:
    driver: local
  wp_home_uploads:
    driver: local
  wp_customers_uploads:
    driver: local

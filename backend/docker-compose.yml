services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - backend-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN}`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"

  mysql:
    image: mysql:8.4
    container_name: backend-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Pass credentials for user creation script
      WP_HOME_DB_USER: ${WP_HOME_DB_USER}
      WP_HOME_DB_PASSWORD: ${WP_HOME_DB_PASSWORD}
      WP_ADMIN_DB_USER: ${WP_ADMIN_DB_USER:-}
      WP_ADMIN_DB_PASSWORD: ${WP_ADMIN_DB_PASSWORD:-}
      LARAVEL_DB_USER: ${LARAVEL_DB_USER:-}
      LARAVEL_DB_PASSWORD: ${LARAVEL_DB_PASSWORD:-}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10
      interval: 10s

  wp-home-site-php:
    build:
      context: ./services/wp-home-site
      dockerfile: Dockerfile
      target: production
    container_name: wp-home-site-php
    restart: unless-stopped
    environment:
      DB_NAME: ${WP_HOME_DB_NAME}
      DB_USER: ${WP_HOME_DB_USER}
      DB_PASSWORD: ${WP_HOME_DB_PASSWORD}
      DB_HOST: mysql:3306
      WP_ENV: ${WP_HOME_ENV}
      WP_HOME: https://home.${DOMAIN}
      WP_SITEURL: https://home.${DOMAIN}/wp
      # WordPress security keys
      AUTH_KEY: ${WP_HOME_AUTH_KEY}
      SECURE_AUTH_KEY: ${WP_HOME_SECURE_AUTH_KEY}
      LOGGED_IN_KEY: ${WP_HOME_LOGGED_IN_KEY}
      NONCE_KEY: ${WP_HOME_NONCE_KEY}
      AUTH_SALT: ${WP_HOME_AUTH_SALT}
      SECURE_AUTH_SALT: ${WP_HOME_SECURE_AUTH_SALT}
      LOGGED_IN_SALT: ${WP_HOME_LOGGED_IN_SALT}
      NONCE_SALT: ${WP_HOME_NONCE_SALT}
    volumes:
      - wp_home_uploads:/var/www/html/web/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend-network

  wp-home-site-nginx:
    image: nginx:alpine
    container_name: wp-home-site-nginx
    restart: unless-stopped
    volumes:
      - ./services/wp-home-site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - wp_home_uploads:/var/www/html/web/app/uploads:ro
    depends_on:
      - wp-home-site-php
    networks:
      - backend-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wp-home.rule=Host(`home.${DOMAIN}`)"
      - "traefik.http.routers.wp-home.entrypoints=websecure"
      - "traefik.http.routers.wp-home.tls.certresolver=letsencrypt"
      - "traefik.http.services.wp-home.loadbalancer.server.port=80"
      # HTTP to HTTPS redirect
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.routers.wp-home-http.rule=Host(`home.${DOMAIN}`)"
      - "traefik.http.routers.wp-home-http.entrypoints=web"
      - "traefik.http.routers.wp-home-http.middlewares=redirect-to-https"

networks:
  backend-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  traefik_letsencrypt:
    driver: local
  wp_home_uploads:
    driver: local
